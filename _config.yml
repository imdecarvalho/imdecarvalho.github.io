# Site settings. Content lives in index.md, research.md and experience.md.
title: "Isabella de Carvalho"
author: "Isabella de Carvalho"
tagline: "International and Comparative Politics · The American University of Paris"
description: "Final-year International and Comparative Politics student at the American University of Paris, researching mass violence, international security and conflict."
url: "https://imdecarvalho.github.io"
baseurl: ""
lang: en
email: "imdecarvalho@outlook.com"
linkedin: "https://www.linkedin.com/in/isabella-maria-decarvalho"
cv: "/files/cv.pdf"
photo: ""            # set to "/files/photo.jpg" once the photo is uploaded; until then the Home page shows initials

markdown: kramdown

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  research:
    output: true
    permalink: /research/:name/

defaults:
  - scope: { path: "", type: research }
    values: { layout: paper }
  - scope: { path: "", type: pages }
    values: { layout: page, lang: en }
  - scope: { path: "fr", type: pages }
    values: { layout: page, lang: fr }

exclude: [_docs, CLAUDE.md, README.md]
